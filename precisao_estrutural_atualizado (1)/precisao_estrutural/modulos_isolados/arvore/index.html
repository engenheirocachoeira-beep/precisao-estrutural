<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo isolado: Árvore de Projeto</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body { display:block; padding: 20px; }
        .harness-header { background:#0a192f; color:#fff; padding:14px 20px; border-radius:8px; margin-bottom:16px; font-weight:bold; }
        .harness-nav { display:flex; gap:10px; margin-bottom:20px; }
        .harness-nav .menu-item { background:#fff; border:1px solid #cbd5e1; padding:8px 16px; border-radius:6px; cursor:pointer; }
        .harness-nav .menu-item:hover { background:#e2e8f0; }
        .content-panel { display:none; flex-direction:column; gap:14px; background:#fff; padding:20px; border-radius:8px; min-height:400px; }
        #page-context-title { font-weight:bold; margin-bottom:10px; }
    </style>
</head>
<body>
    <div style="max-width:1100px; margin:0 auto;">
        <div class="harness-header">🧪 Módulo isolado: Árvore de Projeto — testado isoladamente, fora da integração completa</div>
        <div id="page-context-title"></div>
        <div class="harness-nav">
                    <div class="menu-item" onclick="alternarModulo('arvore')">Estrutura de Projeto</div>
        </div>

        <div id="panel-blank-state" class="content-panel" style="display:flex;">Escolha uma opção acima.</div>

<div id="panel-arvore-projetos" class="content-panel" style="flex-direction: row; gap: 20px; height: 100%; overflow: hidden;">
                    <div id="subpanel-lista-projetos-arvore" style="width: 380px; background: #ffffff; border-radius: 6px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden;">
                        <div style="background: #0f223f; color: white; padding: 12px 16px; font-size: 13px; font-weight: 600; border-bottom: 2px solid #00b4d8;">📁 Escolha o Projeto Estrutural</div>
                        <div style="padding: 10px; border-bottom: 1px solid #f1f5f9;"><input type="text" class="search-input" id="search-proj-arvore" placeholder="🔍 Buscar obra ativa..." oninput="filtrarTabelaProjetosArvore()"></div>
                        <div class="table-wrapper" style="flex: 1; max-height: none;"><table style="font-size: 12px;"><thead><tr><th>Prefixo</th><th>Nome da Obra</th></tr></thead><tbody id="tabela-projetos-arvore-body"></tbody></table></div>
                    </div>

                    <div id="subpanel-arvore-visual" style="width: 360px; background: #ffffff; border-radius: 6px; border: 1px solid #e2e8f0; display: none; flex-direction: column; overflow: hidden;">
                        <div style="background: #1e3a66; color: white; padding: 12px 16px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;">
                            <span id="nome-projeto-titulo-arvore">📋 Projeto</span>
                            <button class="btn-secondary" style="padding: 2px 8px; font-size: 10px; background:#475569;" onclick="fecharProjetoAtivoNaArvore()">Fechar</button>
                        </div>
                        <div id="corpo-arvore-eberick" style="flex: 1; overflow-y: auto; padding: 16px; font-size: 13px; color: #334155;"></div>
                    </div>

                    <div id="painel-propriedades-lego" style="flex: 1; background: #ffffff; border-radius: 6px; border: 1px solid #e2e8f0; padding: 24px; display: flex; flex-direction: column; overflow-y: auto;"></div>
                </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/arvore.js"></script>
    <script>
        document.getElementById('panel-blank-state').style.display = 'none';
        alternarModulo('arvore');
    </script>
</body>
</html>
