<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo isolado: Feriados</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body { display:block; padding: 20px; }
        .harness-header { background:#0a192f; color:#fff; padding:14px 20px; border-radius:8px; margin-bottom:16px; font-weight:bold; }
        .harness-nav { display:flex; gap:10px; margin-bottom:20px; }
        .harness-nav .menu-item { background:#fff; border:1px solid #cbd5e1; padding:8px 16px; border-radius:6px; cursor:pointer; }
        .harness-nav .menu-item:hover { background:#e2e8f0; }
        .content-panel { display:none; flex-direction:column; gap:14px; background:#fff; padding:20px; border-radius:8px; min-height:400px; }
        #page-context-title { font-weight:bold; margin-bottom:10px; }
    </style>
</head>
<body>
    <div style="max-width:1100px; margin:0 auto;">
        <div class="harness-header">🧪 Módulo isolado: Feriados — testado isoladamente, fora da integração completa</div>
        <div id="page-context-title"></div>
        <div class="harness-nav">
                    <div class="menu-item" onclick="alternarModulo('feriados')">Feriados</div>
        </div>

        <div id="panel-blank-state" class="content-panel" style="display:flex;">Escolha uma opção acima.</div>

<div id="panel-feriados" class="content-panel">
                    <div class="form-section" style="margin-bottom:16px;">
                        <div class="form-section-title">Feriados Nacionais Fixos (não editáveis — se repetem todo ano)</div>
                        <div class="table-wrapper" style="max-height:200px;">
                            <table><thead><tr><th>Data</th><th>Nome</th></tr></thead><tbody id="fer-tabela-fixos-body"></tbody></table>
                        </div>
                    </div>
                    <div class="form-section">
                        <div class="form-section-title">Outros Feriados (móveis, municipais, pontos facultativos — cadastrados pelo administrador)</div>
                        <div class="table-wrapper" style="max-height:250px;">
                            <table><thead><tr><th>Data</th><th>Nome</th><th style="text-align:center; width:80px;">Ações</th></tr></thead><tbody id="fer-tabela-custom-body"></tbody></table>
                        </div>
                        <div class="footer-actions">
                            <input type="date" id="fer-data" style="padding:8px; border-radius:6px; border:1px solid #cbd5e1; margin-right:10px;">
                            <input type="text" id="fer-nome" placeholder="Nome do feriado (ex: Carnaval)" style="width:260px; padding:8px; border-radius:6px; border:1px solid #cbd5e1; margin-right:10px;">
                            <button class="btn-primary" onclick="adicionarFeriadoCustomizado()">+ Adicionar</button>
                        </div>
                    </div>
                </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/feriados.js"></script>
    <script>
        document.getElementById('panel-blank-state').style.display = 'none';
        alternarModulo('feriados');
    </script>
</body>
</html>
